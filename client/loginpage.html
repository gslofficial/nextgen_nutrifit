<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXTGEN NUTRIFIT Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* CSS to place the eye icon perfectly inside the right side of the password box */
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
            color: #fcfbfb;
        }

        .input-box input {
            width: 100%;
            padding-right: 40px; /* Make space so text doesn't hide behind the eye */
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #777;
            transition: color 0.2s;
            z-index: 10;
        }
        .fa-eye:before {
    color: white;
    content: "\f06e";
}

        .toggle-password:hover {
            color: yellow; /* Accent theme color match */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <img src="./photo/photo1.png" alt="GYMF Logo">
            <h2>NextGen <span>NutriFit</span></h2>
        </div>

        <form class="login-form" id="loginForm">
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="Email Id" required>
            </div>

            <!-- Password Box Updated with the Eye Icon Button Layout -->
            <div class="input-box">
                <i class="fa-solid fa-key" style="color: white"></i>
                <input type="password" name="password" id="passwordInput" placeholder="Enter your password" required>
                <!-- This is the eye icon layout tracking switch -->
                <i class="fa-solid fa-eye toggle-password" id="togglePasswordBtn"></i>
            </div>

            <div class="buttons">
                <a href="forgotpage.html" class="forgot">Forgot Password?</a>
                <button type="submit">Login</button>
            </div>

            <div class="register-link">
                <p>If you haven't an account? <a href="registerpage.html">Register</a></p>
            </div>
        </form>

        <div class="footer">Terms Of Use | Privacy Policy</div>
    </div>

<script>
    // --- 1. SHOW/HIDE PASSWORD TOGGLE HANDLER ---
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');

    togglePasswordBtn.addEventListener('click', function () {
        // Toggle the input type attribute between password and text
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        // Toggle the icon glyph appearance looks (Eye vs Eye-Slash)
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    // --- 2. FORMS SUBMISSION ENGINE LOGIC ---
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            
            if (result.success) {
                window.location.href = 'homepage.html'; 
            } else {
                alert(result.message);
            }
        } catch (err) {
            alert("Could not connect to back-end execution service endpoints.");
        }
    });
</script>

</body>
</html>
