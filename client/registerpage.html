<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGem Gym Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

<div class="register-container">
    <div class="logo">
        <img src="./photo/photo1.png" alt="Logo">
       <h1>NextGen <span>NutriFit</span></h1>
    </div>

    <h2>Create Account</h2>

    <!-- Added an ID to the form -->
    <form id="registerForm">
        <!-- Added name attributes to all inputs -->
        <input type="text" name="fullName" placeholder="Full Name" required>
        <input type="number" name="age" placeholder="Age" required>

        <div class="gender">
            <label><input type="radio" name="gender" value="Male" checked> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>

        <input type="date" name="dob" required>
        <input type="email" name="email" placeholder="Email Address (Login ID)" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="password" name="confirmPassword" placeholder="Confirm Password" required>

        <button type="submit">REGISTER</button>
    </form>

    <p>Already have an account? <a href="loginpage.html">Login</a></p>
</div>

<script>
    // This script catches form submission and sends it to Node.js
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        const response = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        alert(result.message);
        if (result.success) {
            window.location.href = 'loginpage.html'; // Move to login page on success
        }
    });
</script>
</body>
</html>
