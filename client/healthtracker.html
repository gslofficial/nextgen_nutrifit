<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Gym - Nutrition Tracker</title>
    <link rel="stylesheet" href="tracker.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

<header>
    <nav>
        <div class="logo">NextGen <span>NutriFit</span></div>
        <ul>
            <!-- <li><a href="homepage.html">Home</a></li> -->
            <li><a href="#" class="active">Nutrient Tracker</a></li>
            <!-- <li><a href="">Trainers</a></li> -->
        </ul>
        <button class="back-btn" onclick="window.location.href='homepage.html'">Back to Dashboard</button>
    </nav>
</header>

<div class="tracker-container">
    <!-- LEFT PANEL: USER INPUT FORM -->
    <div class="input-card">
        <h2>Log Daily Metrics</h2>
        <form id="healthForm">
            <div class="form-row">
                <div class="input-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" step="0.1" placeholder="e.g., 70" required>
                </div>
                <div class="input-group">
                    <label>Height (cm)</label>
                    <input type="number" id="height" step="0.1" placeholder="e.g., 175" required>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Age (years)</label>
                    <input type="number" id="age" placeholder="e.g., 25" required>
                </div>
                <div class="input-group">
                    <label>Daily Activity Level</label>
                    <select id="activity" required style="background:#1a1a1a; border:1px solid #333; border-radius:6px; padding:12px; color:#fff; font-size:0.95rem; outline:none;">
                        <option value="1.0">Sedentary (No Exercise)</option>
                        <option value="1.2" selected>Lightly Active (Gym 1-3 days/wk)</option>
                        <option value="1.4">Moderately Active (Gym 3-5 days/wk)</option>
                        <option value="1.6">Very Active (Heavy Training)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="calc-btn">CALCULATE & SAVE TARGETS</button>
        </form>
    </div>

    <!-- RIGHT PANEL: CALORIES AND MACROS LAYOUT -->
    <div class="results-card">
        <h2>Daily Maintenance Targets</h2>
        
        <div class="metrics-grid">
            <!-- CALORIES BLOCK -->
            <div class="metric-box special-box">
                <i class="fa-solid fa-fire-flame-curved"></i>
                <h3>Total Energy Intake</h3>
                <div class="value" id="kcalVal">--</div>
                <div class="status">Calories (kcal) / Day</div>
            </div>

            <!-- MACROS SPLIT -->
            <div class="macro-row">
                <div class="metric-box">
                    <i class="fa-solid fa-egg" style="color: #ffff00;"></i>
                    <h3>Protein</h3>
                    <div class="value" id="proteinVal">--</div>
                    <div class="status">For Muscle Repair</div>
                </div>

                <div class="metric-box">
                    <i class="fa-solid fa-cheese" style="color: #ffff00;"></i>
                    <h3>Healthy Fats</h3>
                    <div class="value" id="fatVal">--</div>
                    <div class="status">For Healthy Hormones</div>
                </div>
            </div>

            <div class="macro-row">
                <div class="metric-box">
                    <i class="fa-solid fa-wheat-awn" style="color: #ffff00;"></i>
                    <h3>Carbohydrates</h3>
                    <div class="value" id="carbsVal">--</div>
                    <div class="status">For Sustainable Energy</div>
                </div>

                <div class="metric-box">
                    <i class="fa-solid fa-apple-whole" style="color: #ffff00;"></i>
                    <h3>Dietary Fiber</h3>
                    <div class="value" id="fiberVal">--</div>
                    <div class="status">For Gut Health</div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    document.getElementById('healthForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const w = parseFloat(document.getElementById('weight').value);
        const h = parseFloat(document.getElementById('height').value);
        const age = parseInt(document.getElementById('age').value);
        const activityFactor = parseFloat(document.getElementById('activity').value);

        // --- NUTRITIONAL MATHEMATICS ---
        const baseKcal = w * 24;
        const totalKcal = baseKcal * activityFactor;
        
        const proteinGrams = w * 1.6;
        const fatGrams = w * 0.7;
        const fiberGrams = (totalKcal / 1000) * 14;
        
        const carbsGrams = (totalKcal - ((proteinGrams * 4) + (fatGrams * 9))) / 4;

        // Render targets to user layout blocks
        document.getElementById('kcalVal').innerText = Math.round(totalKcal);
        document.getElementById('proteinVal').innerText = Math.round(proteinGrams) + "g";
        document.getElementById('fatVal').innerText = Math.round(fatGrams) + "g";
        document.getElementById('carbsVal').innerText = Math.round(carbsGrams) + "g";
        document.getElementById('fiberVal').innerText = Math.round(fiberGrams) + "g";

        // Save entry directly to MongoDB
        try {
            const response = await fetch('/auth/health-log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    weight: w, 
                    height: h, 
                    calories: Math.round(totalKcal), 
                    protein: Math.round(proteinGrams),
                    fats: Math.round(fatGrams),
                    carbs: Math.round(carbsGrams),
                    fiber: Math.round(fiberGrams)
                })
            });
            if (response.ok) {
                alert("Nutrition targets successfully calculated and saved! 💾");
            }
        } catch (err) {
            alert("Calculated locally, but could not sync with database.");
        }
    });
</script>
</body>
</html>
